name: Notify Docs Update
on:
  push:
    branches: [main]
    # The three files valu-docs copies (scripts/sync-valu-api-docs.mjs there).
    paths: [README.md, valu-routing.md, docs/service-api.md]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # --fail-with-body: a refused dispatch (an expired DOCS_DISPATCH_TOKEN
      # answers 401) fails the run instead of passing with the error printed.
      - name: Trigger valu-docs sync
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DOCS_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Roomful/valu-docs/dispatches \
            -d '{"event_type":"update-valu-api-docs"}'
