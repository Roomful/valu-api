name: Publish to npm

# A release is a version in package.json that npm does not have yet. When a
# push to main brings one, this tests the package, publishes it and tags the
# commit with a GitHub release of the same name (no `v`, as 1.1.3 was).
# Pushing main without changing the version publishes nothing.
#
# Run it by hand (workflow_dispatch) to see what would be packed and whether
# the credentials still work; it publishes only when `dry_run` is off and the
# version is new.
#
# AUTH: npm Trusted Publishing (OIDC), no token. npm retired the classic
# tokens this used to publish with, so the run carries no npm credential of
# its own: it asks GitHub for an OIDC token and npm trades that for a publish
# token -- but only once a package owner has registered THIS workflow on
# npmjs.com:
#
#   npmjs.com -> @arkeytyp/valu-api -> Settings -> Trusted Publisher ->
#   GitHub Actions; organization `Roomful`, repository `valu-api`,
#   workflow `npm.yml`, environment left empty.
#
# npm never checks that registration when it is saved, and refuses the
# exchange silently when it is missing or does not match: `npm publish` then
# falls back to whatever token it has, and the registry answers an
# unauthorized PUT with a 404 that reads as if the package did not exist. So
# `How this run will authenticate` below makes the same exchange npm makes and
# prints what npm said about it, and the run stops there rather than ending in
# that misleading 404.
#
# A granular NPM_TOKEN secret with write access to the package, if one is set,
# is still used as a fallback.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the credentials and the package, publish nothing
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11

      - name: Which version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@arkeytyp/valu-api@$version" version > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$version is on npm already: nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "$version is not on npm yet."
          fi

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.version.outputs.new }}" = "true" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.dry_run }}" = "false" ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Asks for the OIDC token and offers it to npm exactly as `npm publish`
      # would, so a registration that is missing or does not match this
      # workflow is named here instead of surfacing as a 404 on the publish.
      # Both the id token and the exchanged publish token are credentials:
      # only npm's status and message are ever printed.
      - name: How this run will authenticate
        env:
          PUBLISHING: ${{ steps.decide.outputs.publish }}
        run: |
          set -euo pipefail
          npm --version
          package=$(node -p "encodeURIComponent(require('./package.json').name)")
          oidc=no

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            url=$(node -p "const u = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL); u.searchParams.set('audience', 'npm:registry.npmjs.org'); u.href")
            id_token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$url" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).value || ''")
            if [ -z "$id_token" ]; then
              echo "GitHub would not issue an OIDC token for this job."
            else
              echo "::add-mask::$id_token"
              status=$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $id_token" \
                "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$package")
              # A granted exchange answers 201, not 200.
              case "$status" in
              2*)
                oidc=yes
                echo "Trusted Publishing: npm accepted this workflow's OIDC token, HTTP $status."
                ;;
              *)
                said=$(node -p "try { JSON.parse(require('fs').readFileSync('exchange.json', 'utf8')).message || '(no message)' } catch { '(no message)' }")
                echo "Trusted Publishing: npm refused the token exchange, HTTP $status: $said"
                echo "Register this workflow at npmjs.com -> @arkeytyp/valu-api -> Settings ->"
                echo "Trusted Publisher -> GitHub Actions: organization Roomful, repository"
                echo "valu-api, workflow npm.yml, environment empty."
                ;;
              esac
              rm -f exchange.json
            fi
          else
            echo "No OIDC token: this job is missing the id-token: write permission."
          fi

          # A set secret is not a working one: the NPM_TOKEN this published
          # with until 2.0.0 was still set long after npm stopped accepting
          # it. Ask npm who the token is, rather than that it is there.
          token=no
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            status=$(curl -sS -o whoami.json -w '%{http_code}' \
              -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
              https://registry.npmjs.org/-/whoami)
            if [ "$status" = "200" ]; then
              token=yes
              echo "NPM_TOKEN: npm knows it as $(node -p "JSON.parse(require('fs').readFileSync('whoami.json', 'utf8')).username || '(no username)'"). Whether it may write this package is not checked here."
            else
              echo "NPM_TOKEN is set, but npm rejects it, HTTP $status: it has expired, been revoked, or never had access."
            fi
            rm -f whoami.json
          else
            echo "No NPM_TOKEN secret is set."
          fi

          if [ "$oidc" = "no" ] && [ "$token" = "no" ] && [ "$PUBLISHING" = "true" ]; then
            echo "::error::This run has no npm credential npm will accept. Register the trusted publisher above, or set NPM_TOKEN to a granular token with write access to @arkeytyp/valu-api."
            exit 1
          fi

      - name: Test
        if: steps.decide.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm test

      - name: What would be packed
        if: steps.decide.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run

      - name: Publish
        if: steps.decide.outputs.publish == 'true'
        run: npm publish --access public

      # A release of this name may exist already -- somebody cut one by hand
      # while the publish was broken -- and that is not a reason to end a
      # successful publish red.
      - name: Tag it
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "A GitHub release named $VERSION exists already: left as it is."
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
